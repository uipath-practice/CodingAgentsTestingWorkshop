site_name: Coding Agents for Test - Hands-On Workshop Guide
site_description: UiPath Test Cloud & Coding Agents for Test - Instructor-Led Workshop
docs_dir: docs
theme:
  name: material
  logo: assets/images/partner-success-logo-header.png
  palette:
    - scheme: light
      primary: blue
      accent: blue
    - scheme: dark
      primary: blue
      accent: blue

  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - toc.integrate
    - content.code.copy
    - content.tabs.link

extra:
  generator: false

hooks:
  - hooks/cache_bust.py

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/mermaid.min.js
  - assets/js/mermaid-init.js
  - assets/js/sidebar-toggle.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Prerequisites:
    - Overview: module-0-prerequisites/index.md
  - Introduction:
    - Test Cloud & Test Manager: module-1-introduction/index.md
  - Hands-On Workshop:
    - 01. Import and Link the Test Manager Project: module-2-hands-on-workshop/01-import-tm-project.md
    - 02. Evaluate Requirements: module-2-hands-on-workshop/02-evaluate-requirements.md
    - 03. Generate Test Cases: module-2-hands-on-workshop/03-generate-test-cases.md
    - 04. Run Manual Tests: module-2-hands-on-workshop/04-run-manual-tests.md
    - 05. Set Up Studio and Build the Object Repository: module-2-hands-on-workshop/05-build-object-repository.md
    - 06. Automate and Publish the Test Cases: module-2-hands-on-workshop/06-automate-and-publish.md
    - 07. Add Test Cases to the Smoke Test Set: module-2-hands-on-workshop/07-create-test-set.md
    - 08. Run, Triage, and Report: module-2-hands-on-workshop/08-run-and-report.md
    - You did it!: module-2-hands-on-workshop/you-did-it.md
  - Troubleshooting & Next Steps:
    - Overview: module-3-troubleshooting-and-next-steps/index.md
    - More Prompts to Try: module-3-troubleshooting-and-next-steps/01-more-agent-prompts.md
    - Troubleshooting: module-3-troubleshooting-and-next-steps/02-troubleshooting.md
  - Trainer Setup: trainer-setup.md
